<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 195" width="260" height="195" role="img" aria-label="Robots with different bodies and sensors share one sense, perceive, act loop.">
  <defs>
    <marker id="ro-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7a1732"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="260" height="195" fill="#ffffff"/>

  <text x="130" y="20" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3c4043">Different bodies and sensors</text>

  <!-- Soft robot with e-skin -->
  <path d="M30,52 C50,32 85,32 105,50 C85,68 50,70 30,52 Z" fill="#f7f7f5" stroke="#3c4043" stroke-width="1.5"/>
  <circle cx="55" cy="40" r="2.5" fill="#7a1732"/>
  <circle cx="72" cy="37" r="2.5" fill="#7a1732"/>
  <circle cx="89" cy="41" r="2.5" fill="#7a1732"/>

  <!-- Robot arm -->
  <rect x="170" y="72" width="24" height="6" rx="2" fill="none" stroke="#3c4043" stroke-width="1.5"/>
  <path d="M182,72 L172,50 L196,40" fill="none" stroke="#3c4043" stroke-width="1.5"/>
  <path d="M196,40 L204,36 M196,40 L202,47" fill="none" stroke="#3c4043" stroke-width="1.5"/>
  <circle cx="182" cy="72" r="3.5" fill="#ffffff" stroke="#3c4043" stroke-width="1.5"/>
  <circle cx="172" cy="50" r="3.5" fill="#ffffff" stroke="#3c4043" stroke-width="1.5"/>

  <!-- Both feed one loop -->
  <line x1="68" y1="72" x2="60" y2="106" stroke="#5f6368" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="182" y1="82" x2="200" y2="106" stroke="#5f6368" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Sense - Perceive - Act loop -->
  <rect x="24" y="112" width="56" height="26" rx="13" fill="#f7f7f5" stroke="#3c4043" stroke-width="1.5"/>
  <text x="52" y="129" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3c4043">Sense</text>
  <rect x="100" y="112" width="72" height="26" rx="13" fill="#f7f7f5" stroke="#3c4043" stroke-width="1.5"/>
  <text x="136" y="129" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3c4043">Perceive</text>
  <rect x="192" y="112" width="44" height="26" rx="13" fill="#f7f7f5" stroke="#3c4043" stroke-width="1.5"/>
  <text x="214" y="129" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3c4043">Act</text>

  <line x1="82" y1="125" x2="96" y2="125" stroke="#7a1732" stroke-width="1.8" marker-end="url(#ro-arr)"/>
  <line x1="174" y1="125" x2="188" y2="125" stroke="#7a1732" stroke-width="1.8" marker-end="url(#ro-arr)"/>
  <path d="M214,142 L214,160 L52,160 L52,146" fill="none" stroke="#7a1732" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#ro-arr)"/>
</svg>
