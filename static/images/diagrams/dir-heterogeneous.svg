<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 195" width="260" height="195" role="img" aria-label="Three institutions with different model architectures exchange knowledge through a shared hub while their data stays local.">
  <defs>
    <marker id="he-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7a1732"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="260" height="195" fill="#ffffff"/>

  <!-- Knowledge hub -->
  <rect x="70" y="22" width="120" height="30" rx="15" fill="#f7f7f5" stroke="#7a1732" stroke-width="1.5"/>
  <text x="130" y="41" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#7a1732">Shared knowledge</text>

  <!-- Site A: three-node model -->
  <rect x="22" y="98" width="60" height="58" rx="4" fill="#ffffff" stroke="#3c4043" stroke-width="1.5"/>
  <line x1="38" y1="112" x2="52" y2="124" stroke="#3c4043" stroke-width="1"/>
  <line x1="66" y1="112" x2="52" y2="124" stroke="#3c4043" stroke-width="1"/>
  <line x1="38" y1="112" x2="66" y2="112" stroke="#3c4043" stroke-width="1"/>
  <circle cx="38" cy="112" r="2.8" fill="#3c4043"/><circle cx="66" cy="112" r="2.8" fill="#3c4043"/><circle cx="52" cy="124" r="2.8" fill="#3c4043"/>
  <ellipse cx="52" cy="142" rx="9" ry="3.2" fill="none" stroke="#5f6368" stroke-width="1.2"/>
  <path d="M43,142 v6 a9,3.2 0 0 0 18,0 v-6" fill="none" stroke="#5f6368" stroke-width="1.2"/>

  <!-- Site B: four-node model -->
  <rect x="100" y="98" width="60" height="58" rx="4" fill="#ffffff" stroke="#3c4043" stroke-width="1.5"/>
  <line x1="116" y1="110" x2="144" y2="110" stroke="#3c4043" stroke-width="1"/>
  <line x1="116" y1="124" x2="144" y2="124" stroke="#3c4043" stroke-width="1"/>
  <line x1="116" y1="110" x2="144" y2="124" stroke="#3c4043" stroke-width="1"/>
  <line x1="144" y1="110" x2="116" y2="124" stroke="#3c4043" stroke-width="1"/>
  <circle cx="116" cy="110" r="2.8" fill="#3c4043"/><circle cx="144" cy="110" r="2.8" fill="#3c4043"/>
  <circle cx="116" cy="124" r="2.8" fill="#3c4043"/><circle cx="144" cy="124" r="2.8" fill="#3c4043"/>
  <ellipse cx="130" cy="142" rx="9" ry="3.2" fill="none" stroke="#5f6368" stroke-width="1.2"/>
  <path d="M121,142 v6 a9,3.2 0 0 0 18,0 v-6" fill="none" stroke="#5f6368" stroke-width="1.2"/>

  <!-- Site C: chain model -->
  <rect x="178" y="98" width="60" height="58" rx="4" fill="#ffffff" stroke="#3c4043" stroke-width="1.5"/>
  <line x1="192" y1="118" x2="208" y2="110" stroke="#3c4043" stroke-width="1"/>
  <line x1="208" y1="110" x2="224" y2="118" stroke="#3c4043" stroke-width="1"/>
  <circle cx="192" cy="118" r="2.8" fill="#3c4043"/><circle cx="208" cy="110" r="2.8" fill="#3c4043"/><circle cx="224" cy="118" r="2.8" fill="#3c4043"/>
  <ellipse cx="208" cy="142" rx="9" ry="3.2" fill="none" stroke="#5f6368" stroke-width="1.2"/>
  <path d="M199,142 v6 a9,3.2 0 0 0 18,0 v-6" fill="none" stroke="#5f6368" stroke-width="1.2"/>

  <!-- Knowledge exchange (bidirectional); data cylinders have no arrows -->
  <line x1="55" y1="94" x2="97" y2="56" stroke="#7a1732" stroke-width="1.8" marker-start="url(#he-arr)" marker-end="url(#he-arr)"/>
  <line x1="130" y1="94" x2="130" y2="56" stroke="#7a1732" stroke-width="1.8" marker-start="url(#he-arr)" marker-end="url(#he-arr)"/>
  <line x1="205" y1="94" x2="163" y2="56" stroke="#7a1732" stroke-width="1.8" marker-start="url(#he-arr)" marker-end="url(#he-arr)"/>

  <text x="130" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5f6368">Different models &#183; data stays local</text>
</svg>
