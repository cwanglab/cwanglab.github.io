<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 195" width="260" height="195" role="img" aria-label="Four-step pipeline: UK Biobank whole-body MRI, deep-learning measurement, GWAS and PheWAS meta-analyses, clinical insight.">
  <defs>
    <marker id="ma-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7a1732"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="260" height="195" fill="#ffffff"/>

  <!-- Row 1: UK Biobank whole-body MRI -->
  <rect x="22" y="12" width="30" height="30" rx="4" fill="#ffffff" stroke="#3c4043" stroke-width="1.5"/>
  <circle cx="37" cy="21" r="3.5" fill="none" stroke="#3c4043" stroke-width="1.5"/>
  <path d="M31,37 C31,29 43,29 43,37" fill="none" stroke="#3c4043" stroke-width="1.5"/>
  <text x="64" y="31" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3c4043">UK Biobank whole-body MRI</text>

  <!-- Row 2: Deep-learning measurement -->
  <rect x="22" y="57" width="30" height="30" rx="4" fill="#ffffff" stroke="#3c4043" stroke-width="1.5"/>
  <rect x="28" y="63" width="18" height="18" fill="none" stroke="#5f6368" stroke-width="1.2"/>
  <rect x="33" y="68" width="8" height="8" fill="#7a1732"/>
  <text x="64" y="76" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3c4043">Deep-learning measurement</text>

  <!-- Row 3: GWAS and PheWAS meta-analyses -->
  <rect x="22" y="102" width="30" height="30" rx="4" fill="#ffffff" stroke="#3c4043" stroke-width="1.5"/>
  <line x1="27" y1="126" x2="47" y2="126" stroke="#5f6368" stroke-width="1"/>
  <rect x="28" y="117" width="3" height="9" fill="#5f6368"/>
  <rect x="33" y="112" width="3" height="14" fill="#7a1732"/>
  <rect x="38" y="120" width="3" height="6" fill="#5f6368"/>
  <rect x="43" y="108" width="3" height="18" fill="#7a1732"/>
  <text x="64" y="121" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3c4043">GWAS and PheWAS analyses</text>

  <!-- Row 4: Clinical insight -->
  <rect x="22" y="147" width="30" height="30" rx="4" fill="#ffffff" stroke="#3c4043" stroke-width="1.5"/>
  <circle cx="37" cy="162" r="9" fill="none" stroke="#3c4043" stroke-width="1.5"/>
  <rect x="35.5" y="157" width="3" height="10" fill="#7a1732"/>
  <rect x="32" y="160.5" width="10" height="3" fill="#7a1732"/>
  <text x="64" y="166" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3c4043">Clinical insight</text>

  <!-- Flow arrows -->
  <line x1="37" y1="44" x2="37" y2="53" stroke="#7a1732" stroke-width="1.8" marker-end="url(#ma-arr)"/>
  <line x1="37" y1="89" x2="37" y2="98" stroke="#7a1732" stroke-width="1.8" marker-end="url(#ma-arr)"/>
  <line x1="37" y1="134" x2="37" y2="143" stroke="#7a1732" stroke-width="1.8" marker-end="url(#ma-arr)"/>
</svg>
