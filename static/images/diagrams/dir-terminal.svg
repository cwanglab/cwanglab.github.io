<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 195" width="260" height="195" role="img" aria-label="A frozen large model with a small trained SeLoRA adapter deploys to an MRI scanner and a surgical robot.">
  <defs>
    <marker id="te-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7a1732"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="260" height="195" fill="#ffffff"/>

  <!-- Frozen large model -->
  <text x="16" y="28" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3c4043">Large model (frozen)</text>
  <rect x="16" y="38" width="92" height="100" rx="6" fill="#f7f7f5" stroke="#5f6368" stroke-width="1.5"/>
  <rect x="30" y="54" width="64" height="12" rx="2" fill="#d8d9da"/>
  <rect x="30" y="76" width="64" height="12" rx="2" fill="#d8d9da"/>
  <rect x="30" y="98" width="64" height="12" rx="2" fill="#d8d9da"/>

  <!-- SeLoRA adapter: the only trained part -->
  <rect x="97" y="78" width="22" height="22" rx="3" fill="#7a1732"/>
  <rect x="16" y="176" width="10" height="10" rx="2" fill="#7a1732"/>
  <text x="32" y="185" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3c4043">SeLoRA adapter (trained)</text>

  <!-- Deployment arrows -->
  <path d="M119,89 L142,89 L142,60 L150,60" fill="none" stroke="#7a1732" stroke-width="1.8" marker-end="url(#te-arr)"/>
  <path d="M142,89 L142,125 L150,125" fill="none" stroke="#7a1732" stroke-width="1.8" marker-end="url(#te-arr)"/>

  <!-- MRI scanner -->
  <rect x="154" y="38" width="64" height="44" rx="8" fill="#ffffff" stroke="#3c4043" stroke-width="1.5"/>
  <circle cx="186" cy="60" r="13" fill="none" stroke="#3c4043" stroke-width="1.5"/>
  <line x1="173" y1="60" x2="199" y2="60" stroke="#3c4043" stroke-width="1"/>
  <text x="154" y="96" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3c4043">MRI scanner</text>

  <!-- Surgical robot -->
  <rect x="160" y="144" width="26" height="6" rx="2" fill="none" stroke="#3c4043" stroke-width="1.5"/>
  <path d="M173,144 L165,124 L189,114" fill="none" stroke="#3c4043" stroke-width="1.5"/>
  <path d="M189,114 L197,110 M189,114 L195,121" fill="none" stroke="#3c4043" stroke-width="1.5"/>
  <circle cx="173" cy="144" r="3.5" fill="#ffffff" stroke="#3c4043" stroke-width="1.5"/>
  <circle cx="165" cy="124" r="3.5" fill="#ffffff" stroke="#3c4043" stroke-width="1.5"/>
  <text x="154" y="168" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#3c4043">Surgical robot</text>
</svg>
